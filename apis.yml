aid: enterprisedb
name: EDB
image: https://enterprisedb.com/sites/default/files/2025-06/edb-logo-2025_default-og-image.jpg
description: EnterpriseDB (EDB) provides enterprise-class PostgreSQL solutions, including the EDB Postgres Platform, advanced management tools,
  and support services. The company helps organizations deploy, manage, and scale PostgreSQL databases on-premises, in the cloud, and in hybrid
  environments, offering features like high availability, performance optimization, and AI-driven analytics. EDB’s portfolio includes EDB Postgres
  Advanced Server, EDB Postgres Distributed, and cloud-native offerings, catering to enterprises seeking robust, open-source database solutions
  with enterprise-grade support and tooling.
